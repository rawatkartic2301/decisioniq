[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisioniq"
version = "0.1.0"
description = "DecisionIQ: Enterprise Agentic RAG Assistant for Data-to-Decision Workflows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "DecisionIQ Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langgraph>=0.2.20,<0.3.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "chromadb>=0.5.5,<0.6.0",
    "sentence-transformers>=3.0.1,<4.0.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.1,<1.6.0",
    "pandas>=2.2.2,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "sqlglot>=25.10.0,<26.0.0",
    "sqlalchemy>=2.0.32,<3.0.0",
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "fastapi>=0.112.1,<0.113.0",
    "uvicorn>=0.30.6,<0.31.0",
    "streamlit>=1.37.1,<1.38.0",
    "pypdf>=4.3.1,<5.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "fpdf2>=2.7.9,<3.0.0",
    "joblib>=1.4.2,<2.0.0",
    "mlflow>=2.15.1,<3.0.0",
    "rouge-score>=0.1.2",
    "nltk>=3.9.1,<4.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-dotenv>=1.0.1,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.23.8,<0.24.0",
    "ruff>=0.6.1,<0.7.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/decisioniq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --capture=sys"
